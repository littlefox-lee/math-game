<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學勇者：怪獸大對決</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(23, 32, 54, 0.95);
      --neon-blue: #00f0ff;
      --neon-pink: #ff007f;
      --neon-yellow: #ffe600;
      --neon-green: #39ff14;
      --neon-purple: #b026ff;
      --monster-red: #ff3344;
      --hero-blue: #00aaff;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-dark);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(176, 38, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
    }

    .game-container {
      width: 100%;
      max-width: 900px;
      min-height: 680px;
      background: var(--card-bg);
      border: 2px solid rgba(0, 240, 255, 0.3);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
      padding: 24px;
      position: relative;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
    }

    /* Screen management */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      flex: 1;
    }

    .screen.active {
      display: flex;
    }

    h1, h2 {
      text-align: center;
      margin-top: 0;
      text-shadow: 0 0 10px var(--neon-blue);
      letter-spacing: 2px;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--neon-blue);
    }

    .btn {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 2px solid var(--neon-blue);
      color: #fff;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
      margin: 10px 0;
      text-align: center;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--neon-blue);
      background: var(--neon-blue);
      color: #000;
    }

    /* Selection screen layout */
    .selection-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 15px 0;
    }

    .select-card {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .select-card.selected {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.4);
      background: rgba(255, 230, 0, 0.05);
    }

    .select-card .avatar {
      font-size: 4rem;
      margin-bottom: 10px;
    }

    .mode-cards {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 15px;
      margin: 15px 0;
    }

    .mode-card {
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 15px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-card.selected {
      border-color: var(--neon-pink);
      box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
    }

    .mode-card.basic.selected {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 20px rgba(255, 230, 0, 0.5);
    }

    /* HUD elements */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 10px;
    }

    .character-status {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 42%;
    }

    .hp-bar-outer {
      flex: 1;
      height: 18px;
      background: #1a1a2e;
      border-radius: 9px;
      border: 1px solid #444;
      overflow: hidden;
      position: relative;
    }

    .hp-bar-inner {
      height: 100%;
      width: 100%;
      transition: width 0.4s ease;
    }

    .hero-hp { background: linear-gradient(90deg, #0088ff, #00ffff); }
    .monster-hp { background: linear-gradient(90deg, #ff0055, #ff5500); }

    /* Persistent Main Equation Banner */
    .persistent-equation-banner {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.95), rgba(15, 23, 42, 0.95));
      border: 2.5px solid var(--neon-purple);
      border-radius: 12px;
      padding: 12px 18px;
      margin-bottom: 14px;
      display: flex !important; /* Always force flex display */
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 0 18px rgba(176, 38, 255, 0.3);
    }

    .persistent-equation-title {
      font-size: 0.95rem;
      color: #cbd5e1;
      font-weight: bold;
    }

    .persistent-equation-value {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--neon-yellow);
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 230, 0, 0.5);
    }

    /* Battle Stage */
    .battle-stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 160px;
      position: relative;
      margin-bottom: 12px;
      background: radial-gradient(ellipse at center, rgba(30, 41, 59, 0.6) 0%, transparent 70%);
      border-radius: 12px;
      padding: 0 40px;
    }

    .sprite {
      font-size: 5rem;
      transition: transform 0.2s ease;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
    }

    .sprite.hit {
      animation: shake 0.4s ease-in-out;
      filter: drop-shadow(0 0 20px red) hue-rotate(300deg);
    }

    .sprite.attack-hero {
      animation: attackRight 0.4s ease;
    }

    .sprite.attack-monster {
      animation: attackLeft 0.4s ease;
    }

    .laser-beam {
      position: absolute;
      height: 6px;
      background: var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-pink);
      top: 50%;
      display: none;
      z-index: 10;
    }

    .timer-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      margin-bottom: 12px;
      overflow: hidden;
      display: none;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--neon-yellow);
      transition: width 0.1s linear;
    }

    /* Question and Options */
    .question-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid var(--neon-blue);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      text-align: center;
    }

    .step-badge {
      display: inline-block;
      background: var(--neon-purple);
      color: #fff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .question-text {
      font-size: 1.35rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .option-btn {
      background: rgba(30, 41, 59, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 14px;
      font-size: 1.15rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .option-btn:hover {
      border-color: var(--neon-blue);
      background: rgba(0, 240, 255, 0.1);
    }

    /* Neon Assistive Color Highlighting */
    .highlight-x {
      color: var(--neon-pink);
      text-shadow: 0 0 8px var(--neon-pink);
      font-weight: 900;
    }

    .highlight-num {
      color: var(--neon-yellow);
      text-shadow: 0 0 8px var(--neon-yellow);
      font-weight: 900;
    }

    .option-btn.hint-x {
      border-color: var(--neon-pink) !important;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
      background: rgba(255, 0, 127, 0.08);
    }

    .option-btn.hint-num {
      border-color: var(--neon-yellow) !important;
      box-shadow: 0 0 12px rgba(255, 230, 0, 0.4);
      background: rgba(255, 230, 0, 0.08);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-15px); }
      40%, 80% { transform: translateX(15px); }
    }

    @keyframes attackRight {
      0% { transform: translateX(0); }
      50% { transform: translateX(100px) scale(1.2); }
      100% { transform: translateX(0); }
    }

    @keyframes attackLeft {
      0% { transform: translateX(0); }
      50% { transform: translateX(-100px) scale(1.2); }
      100% { transform: translateX(0); }
    }

    .result-box {
      text-align: center;
      margin: auto 0;
    }

    .result-icon {
      font-size: 5rem;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="game-container">
  
  <!-- 1. Start / Selection Screen -->
  <div id="start-screen" class="screen active">
    <h1>⚔️ 數學勇者：怪獸大對決 🪄</h1>
    <p style="text-align: center; color: #94a3b8;">選擇你的英雄角色與遊戲模式，破解因式魔王結界！</p>
    
    <h3>1. 選擇戰鬥角色：</h3>
    <div class="selection-grid">
      <div class="select-card selected" onclick="selectHero('hero', this)">
        <div class="avatar">⚔️</div>
        <div style="font-size: 1.2rem; font-weight: bold;">勇者阿翰</div>
        <div style="color: #64748b; font-size: 0.9rem;">近戰劍技・熱血爆發</div>
      </div>
      <div class="select-card" onclick="selectHero('mage', this)">
        <div class="avatar">🪄</div>
        <div style="font-size: 1.2rem; font-weight: bold;">魔法使小晴</div>
        <div style="color: #64748b; font-size: 0.9rem;">遠程魔法・智慧制敵</div>
      </div>
    </div>

    <h3>2. 選擇遊戲模式：</h3>
    <div class="mode-cards">
      <div class="mode-card basic selected" onclick="selectMode('basic', this)">
        <div style="font-size: 1.8rem;">🟡</div>
        <div style="font-weight: bold; color: var(--neon-yellow);">視覺輔助版</div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">公因式與變數螢光顏色對照提示</div>
      </div>
      <div class="mode-card" onclick="selectMode('normal', this)">
        <div style="font-size: 1.8rem;">⚔️</div>
        <div style="font-weight: bold; color: var(--neon-blue);">標準闖關版</div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">無額外提示，自主獨立解題</div>
      </div>
      <div class="mode-card" onclick="selectMode('speed', this)">
        <div style="font-size: 1.8rem;">⏱️</div>
        <div style="font-weight: bold; color: var(--neon-pink);">20秒限時版</div>
        <div style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">極速倒數反應，挑戰熟練度</div>
      </div>
    </div>

    <button class="btn" style="margin-top: 15px;" onclick="startGame()">開始戰鬥！出發打怪！</button>
  </div>

  <!-- 2. Battle Screen -->
  <div id="battle-screen" class="screen">
    <!-- Top HUD -->
    <div class="hud">
      <div class="character-status">
        <span id="hero-avatar" style="font-size: 2rem;">⚔️</span>
        <div style="flex: 1;">
          <div style="font-size: 0.85rem; font-weight: bold; margin-bottom: 2px;" id="hero-name">勇者阿翰</div>
          <div class="hp-bar-outer">
            <div id="hero-hp-bar" class="hp-bar-inner hero-hp"></div>
          </div>
        </div>
      </div>

      <div style="font-size: 1.1rem; font-weight: bold; color: var(--neon-yellow);" id="stage-indicator">第 1 / 5 關</div>

      <div class="character-status" style="flex-direction: row-reverse;">
        <span id="monster-avatar" style="font-size: 2rem;">👾</span>
        <div style="flex: 1;">
          <div style="font-size: 0.85rem; font-weight: bold; margin-bottom: 2px; text-align: right;" id="monster-name">因式小魔王</div>
          <div class="hp-bar-outer">
            <div id="monster-hp-bar" class="hp-bar-inner monster-hp"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Persistent Main Equation Banner (Always displays FULL quadratic equation) -->
    <div id="persistent-banner" class="persistent-equation-banner">
      <div class="persistent-equation-title">📌 目標方程式：</div>
      <div id="persistent-eq-text" class="persistent-equation-value">x² + 5x = 0</div>
    </div>

    <!-- Timer for 20s mode -->
    <div id="timer-container" class="timer-container">
      <div id="timer-bar" class="timer-bar"></div>
    </div>

    <!-- Battle Stage -->
    <div class="battle-stage">
      <div id="hero-sprite" class="sprite">⚔️</div>
      <div id="laser-beam" class="laser-beam"></div>
      <div id="monster-sprite" class="sprite">👾</div>
    </div>

    <!-- Question Box -->
    <div class="question-box">
      <div id="step-badge" class="step-badge">第一招：一抓公因式</div>
      <div id="question-text" class="question-text">公因式 = ？</div>
    </div>

    <!-- Options Grid (Fisher-Yates Shuffled) -->
    <div id="options-grid" class="options-grid"></div>
  </div>

  <!-- 3. Result Screen -->
  <div id="result-screen" class="screen">
    <div class="result-box">
      <div id="result-icon" class="result-icon">🏆</div>
      <h1 id="result-title">戰鬥勝利！</h1>
      <p id="result-desc" style="font-size: 1.2rem; color: #94a3b8; margin: 20px 0;">你成功解開了所有的因式結界，拯救了數學王國！</p>
      <button class="btn" onclick="resetToStart()">返回主選單再次挑戰</button>
    </div>
  </div>

</div>

<script>
  let selectedHero = 'hero';
  let selectedMode = 'basic';
  
  let currentStageIndex = 0;
  let currentStepIndex = 0; // 0: 一抓, 1: 二提, 2: 三拆開
  let heroHp = 100;
  let monsterHp = 100;
  let timerInterval = null;
  let timeLeft = 20;

  // Web Audio API 原生電玩音效合成器
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new AudioContext();
    }
  }

  function playSound(type) {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'attack') {
        // 雷射攻擊音效 (發射高頻到低頻的雷射聲)
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(110, now + 0.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        osc.start(now);
        osc.stop(now + 0.2);
      } else if (type === 'hit') {
        // 受重擊音效 (低頻爆破重音)
        osc.type = 'square';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        // 勝利凱旋琶音音效 (C-E-G-C 揚聲)
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const noteOsc = audioCtx.createOscillator();
          const noteGain = audioCtx.createGain();
          noteOsc.type = 'triangle';
          noteOsc.connect(noteGain);
          noteGain.connect(audioCtx.destination);
          noteOsc.frequency.setValueAtTime(freq, now + idx * 0.12);
          noteGain.gain.setValueAtTime(0.3, now + idx * 0.12);
          noteGain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.12 + 0.3);
          noteOsc.start(now + idx * 0.12);
          noteOsc.stop(now + idx * 0.12 + 0.3);
        });
      }
    } catch (e) {
      console.log("Audio API Error: ", e);
    }
  }

  // 3 Complete Levels with 4 options per step and Chinese step prompts for the assistive mode
  const stagesData = [
    {
      eqNormal: "x² + 3x = 0",
      eqBasic: "<span class='highlight-x'>x</span>² + 3<span class='highlight-x'>x</span> = 0",
      monsterName: "草泥怪魔",
      monsterAvatar: "👾",
      steps: [
        {
          badge: "步驟一：一抓（公因式）",
          textNormal: "x² + 3x = 0",
          textBasic: "【一抓公因式】：<span class='highlight-x'>x</span>² + 3<span class='highlight-x'>x</span> = 0 中相同的公因式是什麼？",
          options: [
            { text: "x", isCorrect: true, hintType: "x" },
            { text: "3", isCorrect: false },
            { text: "x²", isCorrect: false },
            { text: "3x", isCorrect: false }
          ]
        },
        {
          badge: "步驟二：二提（括號外）",
          textNormal: "x ( _____ ) = 0",
          textBasic: "【二提括號外】：把 <span class='highlight-x'>x</span> 提到外面，括號裡面填什麼？ ➔ <span class='highlight-x'>x</span> ( _____ ) = 0",
          options: [
            { text: "x + 3", isCorrect: true, hintType: "num" },
            { text: "x - 3", isCorrect: false },
            { text: "3x", isCorrect: false },
            { text: "x + 1", isCorrect: false }
          ]
        },
        {
          badge: "步驟三：三拆開（求解）",
          textNormal: "x = 0  或  x + 3 = 0",
          textBasic: "【三拆開求解】：拆成 <span class='highlight-x'>x = 0</span> 或 x + 3 = 0，解出的答案是？",
          options: [
            { text: "x = 0 或 x = -3", isCorrect: true, hintType: "num" },
            { text: "x = 0 或 x = 3", isCorrect: false },
            { text: "x = 3 或 x = -3", isCorrect: false },
            { text: "只有 x = -3", isCorrect: false }
          ]
        }
      ]
    },
    {
      eqNormal: "x² - 6x = 0",
      eqBasic: "<span class='highlight-x'>x</span>² - 6<span class='highlight-x'>x</span> = 0",
      monsterName: "暗影刺客",
      monsterAvatar: "👹",
      steps: [
        {
          badge: "步驟一：一抓（公因式）",
          textNormal: "x² - 6x = 0",
          textBasic: "【一抓公因式】：<span class='highlight-x'>x</span>² - 6<span class='highlight-x'>x</span> = 0 中兩項都有的公因式是？",
          options: [
            { text: "x", isCorrect: true, hintType: "x" },
            { text: "6", isCorrect: false },
            { text: "-6", isCorrect: false },
            { text: "6x", isCorrect: false }
          ]
        },
        {
          badge: "步驟二：二提（括號外）",
          textNormal: "x ( _____ ) = 0",
          textBasic: "【二提括號外】：把 <span class='highlight-x'>x</span> 提到外面，括號內留什麼？ ➔ <span class='highlight-x'>x</span> ( _____ ) = 0",
          options: [
            { text: "x - 6", isCorrect: true, hintType: "num" },
            { text: "x + 6", isCorrect: false },
            { text: "6 - x", isCorrect: false },
            { text: "x - 1", isCorrect: false }
          ]
        },
        {
          badge: "步驟三：三拆開（求解）",
          textNormal: "x = 0  或  x - 6 = 0",
          textBasic: "【三拆開求解】：拆成 <span class='highlight-x'>x = 0</span> 或 x - 6 = 0，算出的 x 是？",
          options: [
            { text: "x = 0 或 x = 6", isCorrect: true, hintType: "num" },
            { text: "x = 0 或 x = -6", isCorrect: false },
            { text: "x = 6 或 x = -6", isCorrect: false },
            { text: "只有 x = 6", isCorrect: false }
          ]
        }
      ]
    },
    {
      eqNormal: "2x² + 8x = 0",
      eqBasic: "<span class='highlight-x'>2x</span>² + 8<span class='highlight-x'>x</span> = 0",
      monsterName: "煉獄巨魔",
      monsterAvatar: "👺",
      steps: [
        {
          badge: "步驟一：一抓（公因式）",
          textNormal: "2x² + 8x = 0",
          textBasic: "【一抓公因式】：2與8有公因數2，抓出相同的 <span class='highlight-x'>2x</span>：",
          options: [
            { text: "2x", isCorrect: true, hintType: "x" },
            { text: "x", isCorrect: false },
            { text: "8x", isCorrect: false },
            { text: "2", isCorrect: false }
          ]
        },
        {
          badge: "步驟二：二提（括號外）",
          textNormal: "2x ( _____ ) = 0",
          textBasic: "【二提括號外】：把 <span class='highlight-x'>2x</span> 提到外面 ➔ <span class='highlight-x'>2x</span> ( _____ ) = 0",
          options: [
            { text: "x + 4", isCorrect: true, hintType: "num" },
            { text: "x + 8", isCorrect: false },
            { text: "2x + 4", isCorrect: false },
            { text: "x - 4", isCorrect: false }
          ]
        },
        {
          badge: "步驟三：三拆開（求解）",
          textNormal: "2x = 0  或  x + 4 = 0",
          textBasic: "【三拆開求解】：拆成 <span class='highlight-x'>2x = 0</span> 或 x + 4 = 0，最後答案是？",
          options: [
            { text: "x = 0 或 x = -4", isCorrect: true, hintType: "num" },
            { text: "x = 0 或 x = 4", isCorrect: false },
            { text: "x = 2 或 x = -4", isCorrect: false },
            { text: "x = 0 或 x = -8", isCorrect: false }
          ]
        }
      ]
    }
  ];

  // Fisher-Yates Shuffle Algorithm
  function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function selectHero(hero, element) {
    selectedHero = hero;
    document.querySelectorAll('.selection-grid .select-card').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
  }

  function selectMode(mode, element) {
    selectedMode = mode;
    document.querySelectorAll('.mode-cards .mode-card').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  function startGame() {
    currentStageIndex = 0;
    currentStepIndex = 0;
    heroHp = 100;
    monsterHp = 100;

    const heroAvatar = selectedHero === 'hero' ? '⚔️' : '🪄';
    const heroName = selectedHero === 'hero' ? '勇者阿翰' : '魔法使小晴';
    document.getElementById('hero-avatar').textContent = heroAvatar;
    document.getElementById('hero-sprite').textContent = heroAvatar;
    document.getElementById('hero-name').textContent = heroName;

    showScreen('battle-screen');
    updateHpBars();

    const timerContainer = document.getElementById('timer-container');
    timerContainer.style.display = selectedMode === 'speed' ? 'block' : 'none';

    loadQuestion();
  }

  function loadQuestion() {
    clearInterval(timerInterval);

    const stage = stagesData[currentStageIndex];
    const step = stage.steps[currentStepIndex];

    document.getElementById('stage-indicator').textContent = `第 ${currentStageIndex + 1} / ${stagesData.length} 關`;
    document.getElementById('monster-name').textContent = stage.monsterName;
    document.getElementById('monster-avatar').textContent = stage.monsterAvatar;
    document.getElementById('monster-sprite').textContent = stage.monsterAvatar;

    // Persistent Equation Header (Always stays visible)
    const persistentEq = selectedMode === 'basic' ? stage.eqBasic : stage.eqNormal;
    document.getElementById('persistent-eq-text').innerHTML = persistentEq;

    // Step Badge and Prompt text
    document.getElementById('step-badge').textContent = step.badge;
    const qText = selectedMode === 'basic' ? step.textBasic : step.textNormal;
    document.getElementById('question-text').innerHTML = qText;

    // Shuffle and render options
    const shuffledOptions = shuffleArray(step.options);
    const optionsGrid = document.getElementById('options-grid');
    optionsGrid.innerHTML = '';

    shuffledOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = opt.text;

      if (selectedMode === 'basic' && opt.hintType) {
        if (opt.hintType === 'x') btn.classList.add('hint-x');
        if (opt.hintType === 'num') btn.classList.add('hint-num');
      }

      btn.onclick = () => handleAnswer(opt.isCorrect);
      optionsGrid.appendChild(btn);
    });

    if (selectedMode === 'speed') {
      startTimer();
    }
  }

  function startTimer() {
    timeLeft = 20;
    const timerBar = document.getElementById('timer-bar');
    timerBar.style.width = '100%';

    timerInterval = setInterval(() => {
      timeLeft -= 0.1;
      const percentage = (timeLeft / 20) * 100;
      timerBar.style.width = `${Math.max(0, percentage)}%`;

      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleAnswer(false);
      }
    }, 100);
  }

  function handleAnswer(isCorrect) {
    clearInterval(timerInterval);

    const heroSprite = document.getElementById('hero-sprite');
    const monsterSprite = document.getElementById('monster-sprite');
    const laserBeam = document.getElementById('laser-beam');

    if (isCorrect) {
      // 播放攻擊與命中音效
      playSound('attack');
      heroSprite.classList.add('attack-hero');
      laserBeam.style.display = 'block';

      setTimeout(() => {
        monsterSprite.classList.add('hit');
        laserBeam.style.display = 'none';
        monsterHp -= 34;
        if (monsterHp < 0) monsterHp = 0;
        updateHpBars();
      }, 200);

      setTimeout(() => {
        heroSprite.classList.remove('attack-hero');
        monsterSprite.classList.remove('hit');

        currentStepIndex++;
        if (currentStepIndex >= 3) {
          currentStepIndex = 0;
          currentStageIndex++;
          monsterHp = 100;
        }

        if (currentStageIndex >= stagesData.length) {
          endGame(true);
        } else {
          loadQuestion();
        }
      }, 600);

    } else {
      // 播放受擊重音音效
      playSound('hit');
      monsterSprite.classList.add('attack-monster');

      setTimeout(() => {
        heroSprite.classList.add('hit');
        heroHp -= 25;
        if (heroHp < 0) heroHp = 0;
        updateHpBars();
      }, 200);

      setTimeout(() => {
        monsterSprite.classList.remove('attack-monster');
        heroSprite.classList.remove('hit');

        if (heroHp <= 0) {
          endGame(false);
        } else {
          loadQuestion();
        }
      }, 600);
    }
  }

  function updateHpBars() {
    document.getElementById('hero-hp-bar').style.width = `${heroHp}%`;
    document.getElementById('monster-hp-bar').style.width = `${monsterHp}%`;
  }

  function endGame(isWin) {
    showScreen('result-screen');
    const title = document.getElementById('result-title');
    const desc = document.getElementById('result-desc');
    const icon = document.getElementById('result-icon');

    if (isWin) {
      playSound('win');
      icon.textContent = '🏆';
      title.textContent = '戰鬥勝利！魔王退散！';
      title.style.color = 'var(--neon-yellow)';
      desc.textContent = '太棒了！你完美運用「一抓、二提、三拆開」成功拯救了數學王國！';
    } else {
      playSound('hit');
      icon.textContent = '💀';
      title.textContent = '戰敗！再接再厲！';
      title.style.color = 'var(--monster-red)';
      desc.textContent = '別灰心！記得複習「一抓、二提、三拆開」再試一次！';
    }
  }

  function resetToStart() {
    showScreen('start-screen');
  }
</script>
</body>
</html>
